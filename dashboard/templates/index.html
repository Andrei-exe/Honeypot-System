<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Honeypot Dashboard</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/layout.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/tables.css">
  <link rel="stylesheet" href="/static/css/inspector.css">
  <link rel="stylesheet" href="/static/css/copilot.css">
  <link rel="stylesheet" href="/static/css/pages.css">
</head>
<body>
  <div class="soc-shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-block">
          <span class="brand-mark"></span>
          <span>Honeypot</span>
        </div>
        <span class="status-pill" id="tel-status">
          <span class="led" id="tel-status-led"></span>
          <span id="tel-status-text">Connecting…</span>
        </span>
        <span class="topbar-muted" id="tel-sync"></span>
      </div>

      <div class="topbar-right">
        <button class="btn live-on" id="btn-live" title="Refresh automatically every 4 seconds (Space)">Live</button>
        <button class="btn" id="btn-refresh" title="Refresh now (R)">Refresh</button>
        <button class="btn" id="btn-palette" title="Search commands and pages (Ctrl+K)">Commands</button>
        <button class="btn primary" id="btn-copilot" title="Ask the assistant (F1)">Assistant</button>
        <button class="btn icon ghost" id="btn-help" title="Keyboard shortcuts">?</button>
      </div>

      <div class="help-pop hidden" id="help-pop">
        <h4>Keyboard shortcuts</h4>
        <div class="help-row"><span>Search / filter</span><kbd>/</kbd></div>
        <div class="help-row"><span>Commands</span><kbd>Ctrl K</kbd></div>
        <div class="help-row"><span>Assistant</span><kbd>F1</kbd></div>
        <div class="help-row"><span>Switch page</span><kbd>1 – 7</kbd></div>
        <div class="help-row"><span>Move through rows</span><kbd>J / K</kbd></div>
        <div class="help-row"><span>Open selected row</span><kbd>Enter</kbd></div>
        <div class="help-row"><span>Pause live updates</span><kbd>Space</kbd></div>
        <div class="help-row"><span>Refresh</span><kbd>R</kbd></div>
        <div class="help-row"><span>Close panel</span><kbd>Esc</kbd></div>
      </div>
    </header>

    <div class="soc-body">
      <nav class="nav-rail" aria-label="Pages">
        <div class="nav-section-title">Monitor</div>
        <button class="nav-item active" data-view="overview">
          <span class="nav-item-main">Overview</span>
        </button>
        <button class="nav-item" data-view="alerts">
          <span class="nav-item-main">Alerts</span>
          <span class="nav-count" id="nav-cnt-alerts">0</span>
        </button>
        <button class="nav-item" data-view="sessions">
          <span class="nav-item-main">Sessions</span>
          <span class="nav-count" id="nav-cnt-sessions">0</span>
        </button>

        <div class="nav-section-title">Investigate</div>
        <button class="nav-item" data-view="campaigns">
          <span class="nav-item-main">Campaigns</span>
          <span class="nav-count" id="nav-cnt-campaigns">0</span>
        </button>
        <button class="nav-item" data-view="attackers">
          <span class="nav-item-main">Attackers</span>
          <span class="nav-count" id="nav-cnt-attackers">0</span>
        </button>
        <button class="nav-item" data-view="killchain">
          <span class="nav-item-main">Attack techniques</span>
          <span class="nav-count" id="nav-cnt-honeytokens" title="Honeytoken hits">0</span>
        </button>

        <div class="nav-section-title">Respond</div>
        <button class="nav-item" data-view="defense">
          <span class="nav-item-main">Blocklist</span>
        </button>

        <div class="nav-rail-footer">
          Gateway router honeypot<br>
          SSH · Telnet · FTP · HTTP
        </div>
      </nav>

      <div class="workspace-col">
        <div class="query-toolbar">
          <div class="query-wrap">
            <span class="query-prefix" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input
              type="text"
              id="dsl-query-input"
              class="query-input"
              autocomplete="off"
              spellcheck="false"
              placeholder="Search by IP, username, command… or filter, e.g. sev:high+ proto:ssh"
            >
            <span class="query-status" id="dsl-query-status"></span>
            <button class="query-clear" id="dsl-query-clear" title="Clear search">Clear</button>
          </div>
          <div class="chip-group">
            <button class="chip" data-dsl-append="sev:high+">High &amp; critical</button>
            <button class="chip" data-dsl-append="has:creds">With credentials</button>
            <button class="chip" data-dsl-append="has:honeytoken">Honeytokens</button>
            <button class="chip" data-dsl-append="-proto:http">Hide HTTP</button>
          </div>
        </div>

        <main class="workspace-main" id="workspace-main"></main>
      </div>

      <div class="inspector-resizer collapsed" id="inspector-resizer" title="Drag to resize"></div>
      <aside class="inspector-pane collapsed" id="inspector-pane" aria-label="Details"></aside>
    </div>
  </div>

  <div class="palette-backdrop" id="palette-backdrop">
    <div class="palette-box">
      <input
        type="text"
        id="palette-input"
        class="palette-input"
        autocomplete="off"
        spellcheck="false"
        placeholder="Go to a page, apply a filter or export…"
      >
      <div class="palette-list" id="palette-list"></div>
    </div>
  </div>

  <aside class="copilot-drawer hidden" id="copilot-drawer" aria-label="Assistant"></aside>
  <div class="toast-container" id="toast-container"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
