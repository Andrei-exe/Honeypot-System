# CI: GitHub runs these checks on every push and pull request.
# A red X next to the commit on GitHub = something below failed; click it to see the log.
name: CI

on:
  push:
    branches-ignore: ["dependabot/**"] # Dependabot's branches already get checked through their pull request
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab

# the checks only need to read the code
permissions:
  contents: read

jobs:
  agent:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: honeypot-agent
    steps:
      - uses: actions/checkout@v7

      # the newest 1.27.x patch, the same Go the Dockerfile builds with (golang:1.27-alpine).
      # go.mod only sets the minimum (1.27.4); a newer patch with security fixes is picked up here by itself.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true
          cache-dependency-path: honeypot-agent/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted (run 'gofmt -w .' in honeypot-agent/):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race: the race detector (needs Linux or Windows on x64, which is why it runs here)
      - name: go test -race
        run: go test -race ./...

      # known vulnerabilities (Go's official database) in x/crypto, the other modules and the
      # standard library, reported only if our code actually reaches the vulnerable function.
      # Last step on purpose: a new advisory must not hide the test results.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # the same as the Docker images (python:3.13-slim)

      # catches syntax errors (like "iimport") in every file, even ones no test imports
      - name: py_compile
        run: python -m py_compile threat-engine/*.py dashboard/app.py

      # the tests use plain assert: a failed one raises AssertionError and the script exits with 1
      - name: threat-engine tests
        working-directory: threat-engine
        run: python test_filters.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # ShellCheck: missing quotes, bash-only syntax in a #!/bin/sh script, a CR left by Windows.
      # A fixed image version = the same result here and on a PC (newer versions add new checks).
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.11.0 deploy/*.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # builds all 4 images (--profile loadtest adds loadgen); no .env needed, every variable has a default
      - name: docker compose build
        run: docker compose --profile loadtest build
