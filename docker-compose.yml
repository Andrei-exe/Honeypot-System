# Pornire (din radacina repo-ului):  docker compose up -d --build
# Dashboard-ul:                       http://127.0.0.1:8050
# Evenimentele, live (doar JSON):     docker logs -f honeypot-agent 2>nul        (cmd; in PowerShell: 2>$null)
# Ce primeste Python-ul + alertele:   docker logs -f threat-engine
# Cererile dashboard-ului:            docker logs -f dashboard
# Mesajele tuturor, amestecate:       docker compose logs -f
# Oprire:                             docker compose down
#
# Setarile (porturi, token...) vin din fisierul .env, daca exista (vezi .env.example).
# Fara .env merg valorile de dupa ":-" de mai jos.

services:
  honeypot-agent:
    build: ./honeypot-agent
    container_name: honeypot-agent
    ports:
      # "IP:port_pe_PC:port_in_container"
      # Implicit: doar de pe PC-ul tau (127.0.0.1) si aceleasi porturi ca la `go run .`.
      # Pe VPS, in .env: BIND_IP=0.0.0.0, FTP_PORT=21, SSH_PORT=22, TELNET_PORT=23, HTTP_PORT=80.
      - "${BIND_IP:-127.0.0.1}:${FTP_PORT:-2121}:2121"
      - "${BIND_IP:-127.0.0.1}:${SSH_PORT:-2222}:2222"
      - "${BIND_IP:-127.0.0.1}:${TELNET_PORT:-2323}:2323"
      - "${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    environment:
      # implicit: la threat-engine de mai jos (containerele se gasesc dupa numele serviciului)
      SHIPPER_URL: ${SHIPPER_URL:-http://threat-engine:8000/api/events}
      # aceeasi parola ca la threat-engine (AGENT_TOKEN din .env)
      SHIPPER_TOKEN: ${AGENT_TOKEN:-}
      # Go nu stie singur de mem_limit. Cu asta, GC-ul strange mai des cand heap-ul se apropie
      # de 200MiB (~80% din 256m), in loc sa-l lase sa creasca pana il omoara kernelul.
      GOMEMLIMIT: 200MiB
    extra_hosts:
      # host.docker.internal = PC-ul tau, si pe Linux (pe Docker Desktop merge oricum).
      # Doar daca vrei sa trimiti la un receiver.py pornit direct pe PC (vezi .env.example).
      # Cu deploy/egress-firewall.sh activ (pe server) NU merge: host-ul e blocat intentionat.
      - "host.docker.internal:host-gateway"
    # Server DNS inexistent -> agentul nu poate rezolva nume de pe internet (altfel DNS-ul ar fi
    # un canal ascuns de iesire, pe care regulile de firewall nu-l prind: Docker trimite cererile
    # din numele host-ului). Numele containerelor (threat-engine) le rezolva Docker direct, merg.
    dns:
      - 127.0.0.1
    volumes:
      # cheia SSH sta aici -> acelasi fingerprint si dupa rebuild (altfel ne-am da de gol)
      - agent-data:/data
    networks:
      - honeynet   # reteaua „din fata”, cu porturile publicate pentru atacatori
      - backend    # ca sa ajunga la threat-engine
    depends_on:
      - threat-engine   # porneste intai threat-engine (shipper-ul oricum reincearca daca nu e gata)
    # La `docker stop` agentul inchide sesiunile (max 3s) si trimite ultimele evenimente (max 5s).
    # Docker trimite SIGKILL dupa termenul asta; implicitul difera (masurat ~3,7s pe Docker Desktop)
    # -> il scriem explicit, cu loc de rezerva. In mod normal oprirea dureaza ~1s.
    stop_grace_period: 15s
    # Daca procesul crapa sau serverul da reboot, Docker il porneste la loc.
    # Nu-l porneste doar daca l-ai oprit tu (docker stop / docker compose down).
    restart: unless-stopped
    # Tot sistemul de fisiere al containerului e doar-citire. Se poate scrie DOAR pe volume
    # (aici /data, cu cheia SSH). Cine ar prelua procesul n-are unde sa-si lase fisiere.
    read_only: true
    # Fara nicio "bucata de root" (capabilities: porturi < 1024, pachete raw, chown, kill...).
    # Nu ne trebuie niciuna: ascultam pe porturi > 1024, maparea pe 21/22/23/80 o face Docker.
    cap_drop: [ALL]
    # Niciun proces din container nu poate castiga drepturi in plus (ex. prin binare setuid
    # ca su/passwd, care altfel pornesc ca root). La agent nu exista asa ceva, dar e regula pe toate.
    security_opt:
      - no-new-privileges:true
    # Limite de resurse, ca un atac sau un bug sa nu poata manca tot serverul.
    # Masurat local: 800 de conexiuni tinute deodata = ~31MB si 14 thread-uri;
    # 200 de logari SSH/s = ~0,33 dintr-un core. Restul e loc de rezerva (si pentru tarpit).
    mem_limit: 256m
    memswap_limit: 256m   # = mem_limit -> fara swap (altfel serverul doar se ingreuneaza in loc sa opreasca procesul)
    cpus: 1.0             # maxim un core
    pids_limit: 128       # procese + thread-uri de OS (goroutinele NU se numara, doar thread-urile)
    # Ce scrie pe stdout/stderr pastreaza Docker intr-un fisier pe host. Fara limita,
    # pe un VPS cu atacuri reale umple discul. Aici: max 5 fisiere x 20MB, cele vechi se sterg.
    # Mai mult decat la celelalte: stdout-ul agentului e copia de rezerva a evenimentelor (JSONL).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  threat-engine:
    build: ./threat-engine
    container_name: threat-engine
    # Fara porturi publicate: la el ajung doar agentul (trimite evenimente)
    # si dashboard-ul (cere alertele), prin reteaua backend.
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      INCLUDE_INTERNAL: ${INCLUDE_INTERNAL:-true}
    volumes:
      # received_events.jsonl + alerts.jsonl -> raman si dupa rebuild
      - engine-data:/data
    networks:
      - backend    # DOAR backend: fara internet, atacatorii nu ajung la el direct
    restart: unless-stopped
    # doar-citire; scrie doar pe volumul /data (evenimente, alerte, rezultatele main.py)
    read_only: true
    cap_drop: [ALL]   # fara capabilities (portul 8000 e > 1024)
    # imaginea Debian are 11 binare setuid/setgid (su, passwd, mount...) -> raman fara efect
    security_opt:
      - no-new-privileges:true
    # receiver.py foloseste ~35MB, dar limita se aplica si la `docker compose run ... main.py`,
    # care tine toate evenimentele in RAM (~6x marimea lui received_events.jsonl) -> 512m.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 64        # Flask porneste un thread per cerere; sunt putine cereri deodata
    # max 3 x 10MB de log-uri (evenimentele si alertele sunt oricum pe volum, in /data)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      # DOAR pe 127.0.0.1, si pe VPS: acolo il vezi printr-un tunel SSH.
      # Nu pune niciodata 0.0.0.0 aici: dashboard-ul n-are parola.
      - "127.0.0.1:${DASHBOARD_PORT:-8050}:8050"
    environment:
      # de unde ia alertele: threat-engine, gasit dupa numele serviciului
      THREAT_ENGINE_URL: http://threat-engine:8000
    dns:
      - 127.0.0.1   # fara nume de pe internet, ca la agent (threat-engine se rezolva in continuare)
    networks:
      - backend    # ca sa ajunga la threat-engine
      - frontend   # ca Docker sa-i poata publica portul (dintr-o retea internal: true nu poate)
    depends_on:
      - threat-engine
    restart: unless-stopped
    # doar-citire; dashboard-ul nu scrie nimic pe disc
    read_only: true
    cap_drop: [ALL]   # fara capabilities (portul 8050 e > 1024)
    # imaginea Debian are 11 binare setuid/setgid (su, passwd, mount...) -> raman fara efect
    security_opt:
      - no-new-privileges:true
    # masurat: ~29MB; doar cere alertele si serveste pagina
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # max 3 x 10MB de log-uri (aici sunt doar cererile HTTP ale dashboard-ului)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Generator de incarcare, DOAR pentru teste. Are profil -> NU porneste la `docker compose up`
  # normal (nici pe VPS), doar cand il ceri pe nume:
  #   docker compose up --build --scale loadgen=20 loadgen
  # 20 de copii, fiecare cu IP-ul ei (agentul accepta max 10 conexiuni per IP) -> 200 per serviciu.
  # Evenimentele lui ajung la threat-engine ca orice atac (IP-uri 172.x).
  loadgen:
    profiles: [loadtest]
    build:
      context: ./honeypot-agent
      dockerfile: cmd/loadgen/Dockerfile
    # hold = tine sesiuni deschise; brute = logari SSH gresite in bucla (vezi README "Load testing")
    command: ["-mode", "${LOADGEN_MODE:-hold}", "-seconds", "${LOADGEN_SECONDS:-25}"]
    networks:
      - honeynet   # langa agent, ca sa-l atace direct cu IP-uri diferite

networks:
  honeynet:   # in fata: doar agentul, cu porturile pentru atacatori
    driver_opts:
      # Nume fix pentru switch-ul virtual de pe host (altfel Docker da unul aleator, br-3f551af689e8).
      # Pe el se leaga regulile din deploy/egress-firewall.sh: din containerele de aici nu pleaca
      # nicio conexiune NOUA spre internet sau spre host (raspunsurile catre atacatori trec).
      com.docker.network.bridge.name: br-honeynet
  backend:    # in spate: agent -> threat-engine <- dashboard
    internal: true   # fara iesire la internet
  frontend:   # doar dashboard-ul, ca sa-l poti deschide din browser (127.0.0.1:8050)
    driver_opts:
      com.docker.network.bridge.name: br-frontend   # la fel, pentru dashboard

volumes:
  agent-data:
  engine-data:
